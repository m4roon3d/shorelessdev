name: Probe GCC boards
on:
  workflow_dispatch:
  push:
    branches: [gcc-scrapers]
    paths: ["tools/probe3.py", ".github/workflows/probe3.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/probe3.py
        timeout-minutes: 20
      - run: |
          git config user.name "shoreless-bot"
          git config user.email "shoreless-bot@users.noreply.github.com"
          git add tools/probe3.json
          git diff --cached --quiet || git commit -m "GCC probe results"
          git pull --rebase
          git push
