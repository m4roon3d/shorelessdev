name: Refresh jobs
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["static/jobs.json", "tools/**"]
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests flask
      - run: python build.py
      - name: Commit jobs.json
        run: |
          git config user.name "shoreless-bot"
          git config user.email "shoreless-bot@users.noreply.github.com"
          # Put the fresh jobs.json on top of whatever main is now, so a push made during the run can't conflict.
          git fetch -q origin main
          git reset -q --mixed origin/main
          git add static/jobs.json
          git diff --cached --quiet || git commit -m "Refresh jobs"
          git push origin HEAD:main
