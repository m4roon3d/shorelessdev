name: Probe company boards
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/probe.py", "tools/probe2.py"]
permissions:
  contents: write
concurrency: refresh
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/probe2.py
        timeout-minutes: 40
      - run: |
          git config user.name "shoreless-bot"
          git config user.email "shoreless-bot@users.noreply.github.com"
          git add tools/probe.json tools/probe2.json
          git diff --cached --quiet || git commit -m "Board probe results"
          git pull --rebase
          git push
