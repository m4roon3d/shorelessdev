<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>shoreless.dev</title>
<meta name="description" content="Remote data roles open to India, fresh from the source.">
<meta name="theme-color" content="#F4F4F6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="shoreless.dev">
<meta property="og:description" content="Remote data roles open to India, fresh from the source.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: four views under one header. Today is a single-card deck you can finish; Browse is the full list;
   Pipeline tracks what you saved and applied to; Pulse reads the market from the same feed. */
:root{
  --bg:#F4F4F6; --surface:#FFFFFF; --ink:#0D0D16; --muted:#5B5B6B; --line:#E1E1E8;
  --fill:#FF5A1F; --accent:#C2410C; --accent-ink:#0D0D16; --accent-soft:#FFEDE3;
  --hot:#3A2BFF; --new:#3A2BFF; --new-soft:#ECEAFF;
  --apac:#0E7490; --world:#7C3AED; --locked:#BE123C;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;padding-bottom:48px}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header{padding-block:calc(16px + env(safe-area-inset-top,0px)) 0;display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font:800 24px/1 var(--display);letter-spacing:-.035em}
.brand b span{color:var(--fill)}
.meta{font:12px/1.4 var(--mono);color:var(--muted)}
nav{display:flex;gap:2px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface);margin-block:14px 6px;width:100%}
nav a{flex:1;text-align:center;padding:8px 4px;border-radius:7px;font-size:14px;color:var(--muted);text-decoration:none;white-space:nowrap}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
nav a .n{font:11px var(--mono);margin-left:4px;opacity:.8}

/* shared bits */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--fill);border-color:var(--fill);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.lbl{font:600 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;user-select:none}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .n{font:11px var(--mono);opacity:.75;margin-left:4px}
.t{font:500 11px/1 var(--mono);padding:4px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.t.who{color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent)}
.t.hit{color:var(--accent-ink);background:var(--fill);border-color:var(--fill)}
.t.pay{color:var(--ink);border-color:var(--ink)}
.t.new{color:var(--new);background:var(--new-soft);border-color:transparent}
.t.warn{color:var(--new);border-color:var(--new)}
.tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
h2{font:700 22px/1.25 var(--display);letter-spacing:-.02em;margin:18px 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px;max-width:65ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.empty{padding:36px 8px;text-align:center;color:var(--muted)}

/* tune */
#tune{margin-top:8px;display:grid;gap:12px}
#tune .row{display:grid;gap:6px}

/* today */
.today{max-width:640px;margin:0 auto}
.prog{display:flex;gap:4px;margin:10px 0 14px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.done{background:var(--accent)}
.prog i.cur{background:var(--fill)}
.deck{position:relative;padding-bottom:14px}
.deck::before,.deck::after{content:"";position:absolute;left:10px;right:10px;bottom:7px;height:20px;border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;background:var(--surface)}
.deck::after{left:20px;right:20px;bottom:0}
.deck.last::before,.deck.last::after,.deck.one::after{display:none}
.card{position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:12px;touch-action:pan-y;will-change:transform}
.card .co{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.card h3{font:700 22px/1.2 var(--display);letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;border-block:1px solid var(--line);padding-block:12px;margin:0}
.facts div{display:grid;gap:3px;min-width:0;align-content:start;justify-items:start}
.facts dt{font:600 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.why{font-size:13.5px;color:var(--muted);margin:0}
.why b{color:var(--ink);font-weight:600}
.open{font-weight:600;font-size:14px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.acts .btn{padding:12px 6px}
.keys{font:12px var(--mono);color:var(--muted);text-align:center;margin-top:10px}
@media (hover:none){.keys{display:none}}
.stamp{position:absolute;top:14px;right:14px;font:700 13px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;border:2px solid;background:var(--surface);opacity:0;pointer-events:none}
.stamp.pass{color:var(--muted)} .stamp.save{color:var(--accent)}
.out{text-align:center;padding:28px 12px}
.out svg{width:220px;max-width:100%;height:auto}
.out h3{font:700 22px/1.2 var(--display);letter-spacing:-.02em;margin:10px 0 6px}
.out p{color:var(--muted);margin:0 auto 14px;max-width:44ch}

/* browse */
.filters{display:grid;gap:8px;padding-block:8px 12px;border-bottom:1px solid var(--line)}
.filters .line{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 8px;font-size:13px}
.count{font:12px var(--mono);color:var(--muted);padding:10px 0 6px}
ol.feed{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:grid;gap:6px;min-width:0}
.job.is-new{border-color:var(--hot);box-shadow:inset 3px 0 0 var(--hot)}
.job.dim{opacity:.55}
.job .top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.job .title{font-weight:600;font-size:15.5px;line-height:1.3;color:var(--ink);text-decoration:none;min-width:0;overflow-wrap:anywhere}
.job .title:hover{color:var(--accent);text-decoration:underline}
.age{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.job .co{font-size:14px}.job .co span{color:var(--muted)}
.job .ra{margin-left:auto;display:flex;gap:4px}
.ic{border:1px solid transparent;background:none;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.ic:hover{border-color:var(--line)}
.ic[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.more{display:block;margin:14px auto 0}

/* pipeline */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
.col{display:grid;gap:8px;min-width:0}
.col h4{margin:0;font:600 13px var(--body);display:flex;justify-content:space-between;border-bottom:2px solid var(--line);padding-bottom:6px}
.col h4 span{font:12px var(--mono);color:var(--muted)}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;min-width:0}
.pc a{font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.pc a:hover{text-decoration:underline}
.pc small{color:var(--muted);font-size:12.5px}
.pc input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;font-size:13px;width:100%}
.pc .ctl{display:flex;gap:6px;align-items:center;justify-content:space-between}
.col .none{font-size:13px;color:var(--muted);padding:6px 2px}

/* pulse */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat b{display:block;font:800 28px/1.1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));gap:12px}
.panel h4{margin:0 0 2px;font:600 15px var(--body)}
.panel .note{font-size:13px;color:var(--muted);margin:0 0 12px}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:104px 1fr 44px;gap:8px;align-items:center;font-size:13px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .nm.mine{font-weight:600;color:var(--accent)}
.bar .tr{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:5px;background:var(--fill)}
.bar .v{font:12px var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;margin-bottom:10px}
.split i{display:block;background:var(--c);min-width:3px}
.legend{display:grid;gap:4px;font-size:13px}
.legend div{display:flex;gap:8px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.legend span{margin-left:auto;font:12px var(--mono);color:var(--muted)}
.next{display:grid;gap:8px}
.next div{font-size:14px}
.next b{color:var(--accent)}
details.src{margin-top:16px;font-size:13px;color:var(--muted)}
details.src summary{cursor:pointer}
.srclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 14px;margin-top:8px;font:12px var(--mono)}
.srclist .bad{color:var(--locked)}
/* punch: ink pills, one loud card */
.brand b{font-size:27px;letter-spacing:-.04em}
.brand svg{width:40px;height:40px}
nav{border:0;border-radius:999px;padding:4px;box-shadow:0 0 0 1px var(--line)}
nav a{border-radius:999px;font-weight:500}
nav a[aria-current="page"]{background:var(--ink);color:#fff}
.btn{border-radius:999px;font-weight:600;border-color:var(--ink)}
.btn.sm{border-radius:999px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri:hover{color:#fff;background:var(--ink);border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
h2{font-weight:800;font-size:28px;letter-spacing:-.03em}
.panel,.job,.pc{border-radius:14px}
.card{border:2px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--fill);padding:20px}
.card h3{font-weight:800;font-size:27px;letter-spacing:-.03em;line-height:1.1}
.card .age{color:var(--accent);font-weight:500}
.deck{padding:0 6px 6px 0}
.deck::before,.deck::after{display:none}
.acts{margin-top:18px}
.prog i{height:6px;border-radius:3px}
.prog i.done{background:var(--ink)}
.stat b{color:var(--fill);font-size:34px}
.out svg{width:84px}
.out h3{font-weight:800;font-size:26px}
.col h4{border-bottom-color:var(--ink)}
.filters input[type=search]{border-radius:999px;padding-inline:16px}
@media (prefers-reduced-motion:no-preference){.card.fly{transition:transform .22s ease-out,opacity .22s}.card.back{transition:transform .18s}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="brand" href="#today">
    <svg viewBox="0 0 64 64" aria-hidden="true"><clipPath id="in"><circle cx="29" cy="32" r="25"/></clipPath><circle cx="29" cy="32" r="25" fill="#FF5A1F"/><path d="M2 39 C12 21 23 21 31 33 S50 46 61 26" fill="none" stroke="#3A2BFF" stroke-width="7" stroke-linecap="round"/><path d="M2 39 C12 21 23 21 31 33 S50 46 61 26" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" clip-path="url(#in)"/></svg>
    <b>shoreless<span>.dev</span></b>
  </a>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span class="meta" id="meta">Loading jobs…</span>
    <button class="btn sm" id="tune-btn" type="button" aria-expanded="false" aria-controls="tune">Tune</button>
  </div>
</header>
<section class="panel" id="tune" hidden></section>
<nav aria-label="Views">
  <a href="#today" data-v="today">Today<span class="n" id="n-today"></span></a>
  <a href="#browse" data-v="browse">Browse</a>
  <a href="#pipeline" data-v="pipeline">Pipeline<span class="n" id="n-pipeline"></span></a>
  <a href="#pulse" data-v="pulse">Pulse</a>
</nav>
<main id="view"></main>
</div>

<script>
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const h=(t,a,...c)=>{const e=document.createElement(t);for(const k in a||{}){const v=a[k];
  if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
  else if(k==="value")e.value=v;else if(k==="selected")e.selected=!!v;
  else if(v===true)e.setAttribute(k,"");else if(v!==false&&v!=null)e.setAttribute(k,v)}
  c.flat(3).forEach(x=>{if(x!=null&&x!==false&&x!=="")e.append(x.nodeType?x:document.createTextNode(x))});return e};
const store={get(k,d){try{const v=localStorage.getItem("shoreless:"+k);return v?JSON.parse(v):d}catch{return d}},
  set(k,v){try{localStorage.setItem("shoreless:"+k,JSON.stringify(v))}catch{}},
  del(k){try{localStorage.removeItem("shoreless:"+k)}catch{}}};
const now=()=>Date.now()/1000;
const days=ts=>ts?(now()-ts)/86400:null;
const ago=ts=>{if(!ts)return"—";const d=days(ts);return d<1?Math.max(1,Math.round(d*24))+"h":Math.round(d)+"d"};
const pct=(a,b)=>b?Math.round(100*a/b):0;

/* ---------- vocabulary ---------- */
const WHO={"in-remote":["India · remote","--accent"],"in-office":["India · office","--muted"],apac:["APAC","--apac"],
  world:["Worldwide","--world"],unclear:["Region unclear","--muted"],locked:["Region-locked","--locked"]};
const who=j=>j.region==="India"?(j.remote?"in-remote":"in-office"):({APAC:"apac",Worldwide:"world",Unclear:"unclear",Locked:"locked"})[j.region];
const DIRECT=new Set(["Greenhouse","Lever","Ashby","SmartRecruiters","Workable","HN Who's Hiring"]);
const direct=j=>DIRECT.has(j.source);
const ROLES=["Engineering","Analytics","Architecture","Science"];
const GENERIC=new Set(["Python","SQL"]);
const STAGES=[["saved","Saved"],["applied","Applied"],["interview","Interviewing"],["offer","Offer"],["closed","Closed"]];

/* ---------- state ---------- */
const P=Object.assign({stacks:["Informatica","SQL"],roles:["Engineering","Analytics","Architecture"],
  open:["in-remote","apac","world","unclear"],supply:true},store.get("profile",{}));
const B=Object.assign({q:"",who:null,roles:null,stacks:[],apply:"all",supply:false,senior:false,hidePassed:true,age:30,sort:"fit"},store.get("browse",{}));
if(B.direct)B.apply="direct";delete B.direct;
let T=store.get("triage",{});            // id -> {s, t, note, job}
let jobs=[],byId={},feed=null,seenBefore=new Set(store.get("seen",[]));
let batch=[],pos=0,undo=[],limit=60;
const saveT=()=>store.set("triage",T);
const saveP=()=>store.set("profile",P);
const saveB=()=>store.set("browse",B);
const snap=j=>({id:j.id,pay:j.pay,title:j.title,company:j.company,url:j.url,location:j.location,region:j.region,remote:j.remote,source:j.source});

/* ---------- fit ---------- */
function fit(j){
  const mine=(j.stack||[]).filter(x=>P.stacks.includes(x));
  const core=mine.filter(x=>!GENERIC.has(x)).length, gen=mine.length-core;
  const sc=P.supply&&j.supply, d=days(j.posted), w=who(j);
  const s=3*core+gen+(sc?3:0)+(P.roles.includes(j.role)?2:0)
    +({"in-remote":2,world:2,apac:1,unclear:0,"in-office":-1,locked:-4})[w]
    +(d==null?0:d<3?2:d<7?1:d<14?.5:0)+(direct(j)?.5:0);
  const label=core>=2||(core>=1&&sc)?"Strong fit":(core>=1||sc||gen>=2)?"Good fit":"Role match";
  return {s,mine,sc,label};
}
function tag(txt,cls,cvar){const e=h("span",{class:"t "+(cls||"")},txt);if(cvar)e.style.setProperty("--c",`var(${cvar})`);return e}
const whoTag=j=>tag(WHO[who(j)][0],"who",WHO[who(j)][1]);
const stackTags=(j,n)=>(j.stack||[]).slice().sort((a,b)=>P.stacks.includes(b)-P.stacks.includes(a)).slice(0,n).map(x=>tag(x,P.stacks.includes(x)?"hit":""));

/* ---------- triage actions ---------- */
function setStage(j,s){const prev=T[j.id];
  if(s==null)delete T[j.id];else T[j.id]=s==="pass"?{s,t:now()}:{s,t:now(),note:prev?.note||"",job:prev?.job||snap(j)};
  saveT();counts();return prev}
function candidates(){
  const cut=now()-30*86400;
  return jobs.filter(j=>!T[j.id]&&P.open.includes(who(j))&&P.roles.includes(j.role)&&(!j.posted||j.posted>cut))
    .map(j=>({j,f:fit(j)})).sort((a,b)=>b.f.s-a.f.s||(b.j.posted||0)-(a.j.posted||0));
}
function deal(){batch=candidates().slice(0,15).map(x=>x.j.id);pos=0;undo=[]}
let busy=false;
function act(kind){
  const j=byId[batch[pos]];if(!j||busy)return;
  const prev=setStage(j,kind);undo.push({id:j.id,prev});pos++;
  const card=document.querySelector(".card");
  if(card&&!matchMedia("(prefers-reduced-motion:reduce)").matches){
    busy=true;card.classList.add("fly");card.style.transform=`translateX(${kind==="pass"?-120:120}%) rotate(${kind==="pass"?-6:6}deg)`;card.style.opacity="0";
    setTimeout(()=>{busy=false;render()},200);
  }else render();
}
function undoLast(){const u=undo.pop();if(!u)return;if(u.prev)T[u.id]=u.prev;else delete T[u.id];saveT();pos=Math.max(0,pos-1);render()}

/* ---------- views ---------- */
function nextRefresh(){const d=new Date();const n=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),Math.floor(d.getUTCHours()/6)*6,20));
  while(n<=d)n.setUTCHours(n.getUTCHours()+6);const hrs=(n-d)/36e5;return hrs<1?Math.round(hrs*60)+" minutes":Math.round(hrs)+(Math.round(hrs)===1?" hour":" hours")}
function horizon(){const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 64 64");s.setAttribute("aria-hidden","true");
  s.innerHTML='<clipPath id="in2"><circle cx="29" cy="32" r="25"/></clipPath><circle cx="29" cy="32" r="25" fill="#FF5A1F"/><path d="M2 39 C12 21 23 21 31 33 S50 46 61 26" fill="none" stroke="#3A2BFF" stroke-width="7" stroke-linecap="round"/><path d="M2 39 C12 21 23 21 31 33 S50 46 61 26" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" clip-path="url(#in2)"/>';return s}

function vToday(){
  const el=h("div",{class:"today"});
  if(!feed){el.append(h("p",{class:"empty"},"Loading jobs…"));return el}
  const waiting=candidates().length;
  if(pos>=batch.length){
    const more=waiting>0;
    el.append(h("div",{class:"out panel"},horizon(),
      h("h3",{},more?"That's this batch.":"The tide is out."),
      h("p",{},more?`${waiting} more open roles are waiting, ranked by fit.`:`You've been through every open role that fits. The feed refreshes in about ${nextRefresh()}.`),

  if(f.sc)reasons.push(["is in ",h("b",{},"supply chain")]);
  if(direct(j))reasons.push("applies direct to the employer");
  const d=days(j.posted);if(d!=null&&d<7)reasons.push(`was posted ${ago(j.posted)} ago`);
  const card=h("article",{class:"card"},
    h("span",{class:"stamp pass"},"Pass"),h("span",{class:"stamp save"},"Save"),

      h("div",{},h("dt",{},"Posted"),h("dd",{},j.posted?ago(j.posted)+" ago":"Date not given")),
      h("div",{},h("dt",{},"Pay"),h("dd",{},j.pay||"Not listed")),
      h("div",{},h("dt",{},"Role"),h("dd",{},j.role+(j.level==="Senior+"?" · Senior+":"")+(j.etype?" · "+j.etype:"")))),
    (j.stack||[]).length?h("div",{class:"tags"},stackTags(j,8)):null,

    h("a",{class:"open",href:j.url,target:"_blank",rel:"noopener"},"Read the full posting ↗"));

    h("div",{class:"acts"},

    h("p",{class:"keys",style:"display:block",hidden:!undo.length},h("button",{class:"ic",type:"button",onclick:undoLast},"Undo last")),

function drag(card){
  let x0=null,dx=0;const sp=card.querySelector(".stamp.pass"),ss=card.querySelector(".stamp.save");
  card.addEventListener("pointerdown",e=>{if(e.target.closest("a,button"))return;x0=e.clientX;dx=0;card.classList.remove("back");try{card.setPointerCapture(e.pointerId)}catch{}});
  card.addEventListener("pointermove",e=>{if(x0==null)return;dx=e.clientX-x0;if(Math.abs(dx)<8)return;
    card.style.transform=`translateX(${dx}px) rotate(${dx/40}deg)`;sp.style.opacity=dx<0?Math.min(1,-dx/90):0;ss.style.opacity=dx>0?Math.min(1,dx/90):0});
  const end=()=>{if(x0==null)return;x0=null;if(dx<-90)act("pass");else if(dx>90)act("saved");
    else{card.classList.add("back");card.style.transform="";sp.style.opacity=ss.style.opacity=0}};

function browseList(ignore){
  const q=B.q.trim().toLowerCase(),cut=now()-B.age*86400,W=B.who||P.open,R=B.roles||P.roles;
  return jobs.filter(j=>{
    const st=T[j.id]?.s;
    if(B.hidePassed&&st==="pass")return false;
    if(ignore!=="who"&&!W.includes(who(j)))return false;
    if(ignore!=="role"&&!R.includes(j.role))return false;
    if(ignore!=="stack"&&B.stacks.length&&!B.stacks.some(x=>(j.stack||[]).includes(x)))return false;
    if(ignore!=="apply"&&B.apply!=="all"&&direct(j)!==(B.apply==="direct"))return false;
    if(B.supply&&!j.supply)return false;
    if(B.pay&&!j.pay)return false;
    if(B.senior&&j.level!=="Senior+")return false;
    if(j.posted&&j.posted<cut)return false;
    if(q&&!(j.title+" "+j.company+" "+j.location+" "+(j.stack||[]).join(" ")).toLowerCase().includes(q))return false;
    return true});
}
function chip(label,on,fn,n){return h("button",{class:"chip",type:"button","aria-pressed":String(!!on),onclick:fn},label,n!=null&&h("span",{class:"n"},String(n)))}
function tog(arr,v){const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1)}
function vBrowse(){
  const el=h("div",{});
  if(!feed){el.append(h("p",{class:"empty"},"Loading jobs…"));return el}
  const W=B.who||(B.who=[...P.open]),R=B.roles||(B.roles=[...P.roles]);
  const cw={},cr={},cs={};

  const ap=browseList("apply"),nd=ap.filter(direct).length,ca={all:ap.length,direct:nd,board:ap.length-nd};
  const topS=[...new Set([...B.stacks,...Object.entries(cs).sort((a,b)=>b[1]-a[1]).map(e=>e[0]).slice(0,14)])];
  const re=()=>{limit=60;saveB();render()};
  const search=h("input",{type:"search",id:"q",placeholder:"Search title, company or stack",value:B.q,autocomplete:"off"});
  const list=h("ol",{class:"feed"}),count=h("div",{class:"count"}),more=h("button",{class:"btn more",type:"button",onclick:()=>{limit+=60;paintList()}},"Show more");
  search.addEventListener("input",()=>{B.q=search.value;saveB();limit=60;paintList()});
  function paintList(){
    const L=browseList().map(j=>({j,f:fit(j)}));
    const byPosted=(a,b)=>(b.j.posted||0)-(a.j.posted||0);
    L.sort(({fit:(a,b)=>b.f.s-a.f.s||byPosted(a,b),

      company:(a,b)=>(a.j.company||"~").localeCompare(b.j.company||"~")||byPosted(a,b)})[B.sort]||byPosted);
    const nw=L.filter(x=>x.j._new).length;

    list.replaceChildren(...L.slice(0,limit).map(({j})=>{const st=T[j.id]?.s;
      return h("li",{class:"job"+(j._new?" is-new":"")+(st==="pass"?" dim":"")},
        h("div",{class:"top"},h("a",{class:"title",href:j.url,target:"_blank",rel:"noopener"},j.title),h("span",{class:"age"},B.sort==="arrival"&&j.first_seen?"added "+ago(j.first_seen)+" ago":ago(j.posted))),
        h("div",{class:"co"},j.company||"—",j.location&&h("span",{}," · "+j.location)),
        h("div",{class:"tags"},j._new&&tag("NEW","new"),whoTag(j),j.pay&&tag(j.pay,"pay"),tag(direct(j)?"Direct":"via "+j.source),stackTags(j,4),j.supply&&tag("Supply chain"),
          h("span",{class:"ra"},
            st&&st!=="pass"&&st!=="saved"?tag(STAGES.find(s=>s[0]===st)[1]):
              h("button",{class:"ic",type:"button","aria-pressed":String(st==="saved"),onclick:()=>{setStage(j,st==="saved"?null:"saved");paintList()}},st==="saved"?"★ Saved":"☆ Save"),
            (!st||st==="pass")&&h("button",{class:"ic",type:"button","aria-pressed":String(st==="pass"),onclick:()=>{setStage(j,st==="pass"?null:"pass");paintList()}},st==="pass"?"Passed":"Pass"))))}));

      h("select",{"aria-label":"Sort",id:"sort",onchange:e=>{B.sort=e.target.value;re()}},[["fit","Best fit first"],["arrival","Latest arrival"],["new","Recently posted"],["pay","Highest pay"],["company","Company A–Z"]].map(([v,l])=>h("option",{value:v,selected:B.sort===v},l))),
      h("select",{"aria-label":"Posted within",id:"age",onchange:e=>{B.age=+e.target.value;re()}},[[3,"Past 3 days"],[7,"Past week"],[14,"Past 2 weeks"],[30,"Past month"],[60,"Past 2 months"]].map(([v,l])=>h("option",{value:v,selected:B.age===v},l)))),
    h("div",{class:"line"},h("span",{class:"lbl"},"Who can apply"),Object.keys(WHO).map(k=>chip(WHO[k][0],W.includes(k),()=>{tog(W,k);re()},cw[k]||0))),
    h("div",{class:"line"},h("span",{class:"lbl"},"Role"),ROLES.map(r=>chip(r,R.includes(r),()=>{tog(R,r);re()},cr[r]||0))),
    h("div",{class:"line"},h("span",{class:"lbl"},"Stack"),topS.map(s=>chip(s,B.stacks.includes(s),()=>{tog(B.stacks,s);re()},cs[s]||0))),
    h("div",{class:"line"},h("span",{class:"lbl"},"Apply"),
      [["all","All"],["direct","Direct to employer"],["board","Via job boards"]].map(([k,l])=>chip(l,B.apply===k,()=>{B.apply=k;re()},ca[k]))),
    h("div",{class:"line"},h("span",{class:"lbl"},"Only"),
      chip("Shows pay",B.pay,()=>{B.pay=!B.pay;re()}),chip("Supply chain",B.supply,()=>{B.supply=!B.supply;re()}),
      chip("Senior+",B.senior,()=>{B.senior=!B.senior;re()}),chip("Hide passed",B.hidePassed,()=>{B.hidePassed=!B.hidePassed;re()}))),
    count,list,more);
  paintList();return el;
}

function vPipeline(){
  const el=h("div",{});
  const items=Object.entries(T).filter(([,v])=>v.s!=="pass"&&v.job);
  el.append(h("h2",{},"Pipeline"),h("p",{class:"sub"},"Everything you saved or applied to, kept in this browser. When a posting drops off the employer's board it's flagged here, so you know it closed."));
  if(!items.length){el.append(h("div",{class:"panel empty"},"Nothing here yet. Save a job from Today or Browse and it lands in the first column."));return el}
  const board=h("div",{class:"board"});
  STAGES.forEach(([key,name])=>{
    const mine=items.filter(([,v])=>v.s===key).sort((a,b)=>b[1].t-a[1].t);
    const col=h("section",{class:"col"},h("h4",{},name,h("span",{},String(mine.length))));
    mine.forEach(([id,v])=>{const j=v.job,gone=feed&&!byId[id]&&key!=="closed",late=key==="applied"&&days(v.t)>7;
      const note=h("input",{type:"text",id:"note-"+id,placeholder:"Note: contact, next step…",value:v.note||"","aria-label":"Note"});
      note.addEventListener("change",()=>{T[id].note=note.value;saveT()});
      col.append(h("div",{class:"pc"},
        h("a",{href:j.url,target:"_blank",rel:"noopener"},j.title),
        h("small",{},`${j.company||"—"} · ${WHO[who(j)][0]} · ${name.toLowerCase()} ${ago(v.t)} ago`),
        (gone||late)&&h("div",{class:"tags"},gone&&tag("No longer listed","warn"),late&&tag("Follow up","warn")),
        note,
        h("div",{class:"ctl"},
          h("select",{"aria-label":"Stage",id:"stage-"+id,onchange:e=>{T[id].s=e.target.value;T[id].t=now();saveT();render()}},STAGES.map(([k,n])=>h("option",{value:k,selected:k===key},n))),
          h("button",{class:"ic",type:"button",onclick:()=>{delete T[id];saveT();render()}},"Remove"))));
    });
    if(!mine.length)col.append(h("div",{class:"none"},key==="saved"?"Saved jobs land here.":"—"));
    board.append(col)});

function bars(rows,max,mineSet){return h("div",{class:"bars"},rows.map(([n,v,label])=>h("div",{class:"bar"},
  h("span",{class:"nm"+(mineSet&&mineSet.has(n)?" mine":""),title:n},n),h("span",{class:"tr"},h("i",{style:`width:${v?Math.max(2,100*v/max):0}%`})),h("span",{class:"v"},String(label??v)))))}
function vPulse(){
  const el=h("div",{});
  if(!feed){el.append(h("p",{class:"empty"},"Loading jobs…"));return el}
  const open=jobs.filter(j=>P.open.includes(who(j))),wk=open.filter(j=>j.posted&&days(j.posted)<7);
  const cw={};jobs.forEach(j=>cw[who(j)]=(cw[who(j)]||0)+1);
  el.append(h("h2",{},"Pulse"),h("p",{class:"sub"},`What the market looks like right now, read from the ${jobs.length} data roles in the feed.`),
    h("div",{class:"stats"},
      h("div",{class:"panel stat"},h("b",{},String(open.length)),h("span",{},"roles you can apply to")),
      h("div",{class:"panel stat"},h("b",{},String(wk.length)),h("span",{},"of them posted in the last 7 days")),
      h("div",{class:"panel stat"},h("b",{},pct(open.filter(direct).length,open.length)+"%"),h("span",{},"apply direct to the employer")),
      h("div",{class:"panel stat"},h("b",{},pct(open.filter(j=>j.pay).length,open.length)+"%"),h("span",{},"state their pay"))));
  const cs={};open.forEach(j=>(j.stack||[]).forEach(x=>cs[x]=(cs[x]||0)+1));
  const top=Object.entries(cs).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const core=P.stacks.filter(x=>!GENERIC.has(x));
  const hit=j=>(j.stack||[]).some(x=>core.includes(x));
  const base=open.filter(hit).length;
  const gain=Object.keys(cs).filter(x=>!P.stacks.includes(x)&&!GENERIC.has(x)).map(x=>[x,open.filter(j=>!hit(j)&&j.stack.includes(x)).length]).filter(g=>g[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const cc={};open.forEach(j=>{if(j.company)cc[j.company]=(cc[j.company]||0)+1});
  const topC=Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const buckets=[["0–3 days",0,3],["4–7 days",3,7],["8–14 days",7,14],["15–30 days",14,30],["Older",30,1e9]].map(([n,a,b])=>[n,open.filter(j=>{const d=days(j.posted);return d!=null&&d>=a&&d<b}).length]);
  const order=["in-remote","apac","world","unclear","in-office","locked"];
  el.append(h("div",{class:"grid2"},
    h("section",{class:"panel"},h("h4",{},"Stack demand"),h("p",{class:"note"},"Share of the roles you can apply to that name each technology. Yours are highlighted."),
      top.length?bars(top.map(([n,v])=>[n,v,pct(v,open.length)+"%"]),top[0][1],new Set(P.stacks)):h("p",{class:"note"},"No stack data yet.")),
    h("section",{class:"panel"},h("h4",{},"Your next skill"),
      h("p",{class:"note"},core.length?`${core.join(", ")} ${core.length>1?"appear":"appears"} in ${base} of ${open.length} roles. Adding one more technology would open up:`:"Pick your stack under Tune to see what to learn next."),
      h("div",{class:"next"},core.length?gain.map(([x,n])=>h("div",{},h("b",{},x)," adds ",h("b",{},"+"+n)," roles, for "+(base+n)+" in total.")):null),
      h("h4",{style:"margin-top:18px"},"Who's hiring"),h("p",{class:"note"},"Employers with the most roles you can apply to."),
      topC.length?bars(topC,topC[0][1]):null),
    h("section",{class:"panel"},h("h4",{},"Who can apply"),h("p",{class:"note"},"Every data role in the feed, by where the employer will hire."),
      h("div",{class:"split"},order.filter(k=>cw[k]).map(k=>h("i",{style:`flex:${cw[k]};--c:var(${WHO[k][1]})`,title:WHO[k][0]}))),
      h("div",{class:"legend"},order.map(k=>h("div",{},h("i",{style:`--c:var(${WHO[k][1]})`}),WHO[k][0],h("span",{},`${cw[k]||0} · ${pct(cw[k]||0,jobs.length)}%`))))),
    h("section",{class:"panel"},h("h4",{},"Freshness"),h("p",{class:"note"},"How long the roles you can apply to have been open. Early applications get read."),

  const ok=feed.sources.filter(s=>s.ok).length;
  el.append(h("details",{class:"src"},h("summary",{},`Sources · ${ok} working, ${feed.sources.length-ok} not responding`),
    h("div",{class:"srclist"},feed.sources.map(s=>h("div",{class:s.ok?"":"bad"},s.ok?`${s.key} · ${s.kept}/${s.total}`:`${s.key} · ${s.error==="404"?"not found":s.error}`)))));
  return el;
}

/* ---------- tune ---------- */
function paintTune(){
  const all=[...new Set([...P.stacks,...jobs.flatMap(j=>j.stack||[])])].sort((a,b)=>a.localeCompare(b));
  const re=()=>{saveP();B.who=null;B.roles=null;saveB();deal();paintTune();render()};
  $("tune").replaceChildren(
    h("div",{class:"row"},h("span",{class:"lbl"},"Your stack"),h("div",{class:"chips"},all.map(s=>chip(s,P.stacks.includes(s),()=>{tog(P.stacks,s);re()})))),
    h("div",{class:"row"},h("span",{class:"lbl"},"Roles you want"),h("div",{class:"chips"},ROLES.map(r=>chip(r,P.roles.includes(r),()=>{tog(P.roles,r);re()})))),
    h("div",{class:"row"},h("span",{class:"lbl"},"Who can apply"),h("div",{class:"chips"},Object.keys(WHO).map(k=>chip(WHO[k][0],P.open.includes(k),()=>{tog(P.open,k);re()})))),
    h("div",{class:"row"},h("span",{class:"lbl"},"Domain"),h("div",{class:"chips"},chip("Rank supply chain roles higher",P.supply,()=>{P.supply=!P.supply;re()}))));
}
$("tune-btn").onclick=()=>{const t=$("tune");t.hidden=!t.hidden;$("tune-btn").setAttribute("aria-expanded",String(!t.hidden));if(!t.hidden)paintTune()};

/* ---------- shell ---------- */
const VIEWS={today:vToday,browse:vBrowse,pipeline:vPipeline,pulse:vPulse};
const route=()=>VIEWS[location.hash.slice(1)]?location.hash.slice(1):"today";
function counts(){
  if(!feed)return;
  $("n-today").textContent=candidates().length||"";
  $("n-pipeline").textContent=Object.values(T).filter(v=>v.s!=="pass"&&v.job).length||"";
}
function render(){
  const v=route();
  document.querySelectorAll("nav a").forEach(a=>a.dataset.v===v?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  $("view").replaceChildren(VIEWS[v]());counts();
}
addEventListener("hashchange",()=>{limit=60;render();scrollTo(0,0)});
addEventListener("keydown",e=>{
  if(route()!=="today"||e.metaKey||e.ctrlKey||e.altKey||/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if(k==="arrowleft"||k==="j")act("pass");else if(k==="arrowright"||k==="k")act("saved");else if(k==="a")act("applied");
  else if(k==="u"||k==="z")undoLast();else if(k==="o"){const a=document.querySelector(".card .open");if(a)window.open(a.href,"_blank","noopener")}
});

async function load(){
  try{
    feed=await (await fetch("jobs.json",{cache:"no-cache"})).json();
    const first=seenBefore.size===0;
    jobs=feed.jobs.map(j=>({...j,stack:j.stack||[],_new:!first&&!seenBefore.has(j.id)}));
    byId=Object.fromEntries(jobs.map(j=>[j.id,j]));
    store.set("seen",[...new Set([...seenBefore,...jobs.map(j=>j.id)])].slice(-8000));
    // carry over saves from the earlier version, and forget passes older than 90 days
    for(const [k,s] of [["saved","saved"],["applied","applied"]]){
      store.get(k,[]).forEach(id=>{if(!T[id]&&byId[id])T[id]={s,t:now(),note:"",job:snap(byId[id])}});store.del(k)}
    for(const id in T)if(T[id].s==="pass"&&now()-T[id].t>90*86400)delete T[id];
    saveT();
    $("meta").textContent=`Updated ${ago(feed.updated)} ago · ${feed.sources.filter(s=>s.ok).length} sources`;
    deal();if(!$("tune").hidden)paintTune();render();
  }catch(e){
    console.error(e);
    $("meta").textContent="Couldn't load the job list.";
    $("view").replaceChildren(h("p",{class:"empty"},"Couldn't load the job list. Reload to try again."));
  }
}
render();load();
